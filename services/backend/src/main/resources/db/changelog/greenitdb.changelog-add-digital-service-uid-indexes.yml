databaseChangeLog:
  - changeSet:
      id: add-index-digital-service-uid-in-virtual-equipment
      author: G4IT Dev Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: in_virtual_equipment
                indexName: idx_in_virtual_equipment_digital_service_uid
      changes:
        - createIndex:
            tableName: in_virtual_equipment
            indexName: idx_in_virtual_equipment_digital_service_uid
            columns:
              - column:
                  name: digital_service_uid

