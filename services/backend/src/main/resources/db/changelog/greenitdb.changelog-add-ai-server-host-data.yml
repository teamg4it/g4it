databaseChangeLog:
  - changeSet:
      id: insert-ref-server-host-small-ai-server
      author: G4IT Dev Team
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM ref_server_host WHERE reference = 'Small AI Server (2 × NVIDIA L4)'
      changes:
        - insert:
            tableName: ref_server_host
            columns:
              - column:
                  name: description
                  value: Small AI Server
              - column:
                  name: reference
                  value: ai-server-S
              - column:
                  name: external_referential_description
                  value: Rack server NO, 2 processor high-end, 4 SSD 2048 GB each, 0 HDD, 48 RAM, 64 GB each, 2 GPUs Nvidia L4 (Hubblo), electricty consumption based on NegaOctet server with only 1 GPU
              - column:
                  name: type
                  value: AI
              - column:
                  name: nb_of_vcpu
                  valueNumeric: 48
              - column:
                  name: total_disk
                  value: null
              - column:
                  name: lifespan
                  valueNumeric: 5.0
      rollback:
        - delete:
            tableName: ref_server_host
            where: "reference = 'Small AI Server (2 × NVIDIA L4)'"

