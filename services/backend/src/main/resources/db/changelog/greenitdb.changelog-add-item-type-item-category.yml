                      'DOUANES_PC de bureau',
                      'DOUANES_Portable',
                      'DOUANES_Tablette',
                      'DOUANES_Smartphone',
                      'DOUANES_Ultra Portable',
                      'DOUANES_Ecran',
                      'DOUANES_Téléphone fixe',
                      'DOUANES_Imprimante',
                      'MAIN_Docking station',
                      'MAIN_Portable Scanner',
                      'MAIN_Digital PT Tag',
                      'MAIN_Digital PT Tranceiver',
                      'MAIN_Smartphone Oppo 2 Life',
                      'MAIN_Smartphone Oppo',
                      'MAIN_Mobility Device',
                      'MAIN_Desktop',
                      'MAIN_Monitor 2 Life',
                      'MAIN_Laptop 2 Life',
                      'Terminal',
