                      'Building',
                      'Consumable',
                      'ITService',
                      'Travel',
                      'MAIN_Server Power Supply',
                      'Datacenter',
                      'MAIN_Accessory et consumable',
                      'Paper',
                      'Technical room'
                  ]) THEN 'Non_IT'

                  WHEN type = 'Arcelor Microsoft Cloud'
                      THEN 'External Services'

                  ELSE item_category
              END
              WHERE item_category IS NULL 

  - changeSet:
