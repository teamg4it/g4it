                      'CNR_Ecran',
                      'CNR_PC fixe',
                      'CNR_PC portable',
                      'CNR_Tablette',
                      'CNR_Téléphone fixe',
                      'CNR_Smartphone',
                      'CNR_Camera',
                      'CNR_Audio',
                      'Laptop',
                      'Desktop',
                      'Tablette',
                      'monitor',
                      'Monitor',
                      'Mobile phone',
                      'Fix phone',
                      'Camera',
                      'Feature phone',
                      'Self Check Out',
                      'Mobility Device',
                      'Tracer',
                      'Invoice terminal',
                      'Plotter',
                      'ADEO_Printer',
                      'Network Gear',
                      'Personal Computer',
                      'Cashing System',
                      'Cash registered device',
                      'Docking station',
                      'TV',
                      'Speaker',
                      'Tablet',
                      'Toner',
                      'MAIN_Portable Printer',
                      'MAIN_Cash-desk printer',
                      'MAIN_Network Gear',
                      'MAIN_Access Mobile',
                      'MAIN_Professional laser printer',
