databaseChangeLog:
  - changeSet:
      id: in-out-create-out-table-nonitactivities
      author: G4IT Dev Team
      changes:
        - createTable:
            tableName: out_nonitactivities
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  incrementBy: 100
                  constraints:
                    primaryKey: true
                    primaryKeyName: out_nonitactivities_pk
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: criterion
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: task_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: out_nonitactivities_task_id_fk
                    references: task(id)
                    deleteCascade: true
              - column:
                  name: category
                  type: varchar(255)
              - column:
                  name: subcategory
                  type: varchar(255)
              - column:
                  name: reference
                  type: varchar(255)
              - column:
                  name: status_indicator
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: bigint
              - column:
                  name: unit_impact
                  type: float
              - column:
                  name: people_eq_impact
                  type: float
              - column:
                  name: unit
                  type: varchar(255)
              - column:
                  name: common_filters
                  type: varchar(255) array
              - column:
                  name: errors
                  type: varchar(255) array
              - column:
                  name: source
                  type: varchar(255)
              - column:
                  name: creation_date
                  type: timestamp
              - column:
                  name: last_update_date
                  type: timestamp
        - createIndex:
            tableName: out_nonitactivities
            indexName: idx_out_nonitactivities_task_id
            columns:
              - column:
                  name: task_id
                  descending: true
