databaseChangeLog:
  - changeSet:
      id: add-ref-matching-item-data-for-ai-servers-v2
      author: G4IT Dev Team
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: "0"
          sql: SELECT COUNT(*) FROM ref_matching_item WHERE item_source IN ('Server-ai-4-L40S', 'Server-ai-8-B300')
      changes:
        - loadData:
            file: db/changelog/referential-data/ref_matching_item_ai_server_v2.csv
            tableName: ref_matching_item
            separator: ;
            encoding: UTF-8
            columns:
              - column:
                  name: item_source
                  type: varchar(255)
              - column:
                  name: ref_item_target
                  type: varchar(255)
      rollback:
        - delete:
            tableName: ref_matching_item
            where: "item_source IN ('Server-ai-4-L40S', 'Server-ai-8-B300')"
