<div
    class="equipment-card"
    role="group"
    [attr.aria-label]="
        category + ' — ' + (translateText | translate) + ': ' + (count | decimals)
    "
>
    <ng-icon [name]="icon" size="24px" aria-hidden="true" />
    <span class="count">{{ count | decimals }}</span>
    <span>{{ translateText | translate }}</span>
</div>
