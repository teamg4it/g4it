name: Frontend - Build - Test - Analyze
on:
  pull_request:
    paths:
      - "services/frontend/**"
      - ".github/workflows/frontend-build-test-analyze.yml"
      - ".github/workflows/frontend-analyze-main.yml"
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install dependencies and run tests
        run: |
          cd services/frontend
          npm ci
          npm run test:ci
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: g4itteam_g4it_frontend
          SONAR_ORGANIZATION: g4itteam
        with:
          projectBaseDir: services/frontend
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "services/frontend"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
